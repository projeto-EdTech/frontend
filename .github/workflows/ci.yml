name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-frontend-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: front

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
